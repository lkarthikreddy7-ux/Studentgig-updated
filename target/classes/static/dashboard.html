<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudentGig</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-content" style="padding-top:32px">
        <div class="dashboard-header">
            <h1 id="welcomeMsg">Welcome!</h1>
            <p>Here's what's happening with your freelance journey</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="statJobsPosted">0</div><div class="stat-label">Jobs Posted</div></div>
            <div class="stat-card"><div class="stat-value" id="statActiveJobs">0</div><div class="stat-label">Active Jobs</div></div>
            <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Completed Jobs</div></div>
            <div class="stat-card"><div class="stat-value" id="statApplications">0</div><div class="stat-label">Applications</div></div>
            <div class="stat-card"><div class="stat-value" id="statRating">0</div><div class="stat-label">Rating</div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">
            <div>
                <div class="dashboard-section">
                    <h2>Recommended Jobs</h2>
                    <div id="recommendedJobs"></div>
                </div>
                <div class="dashboard-section">
                    <h2>My Active Jobs</h2>
                    <div id="activeJobsSection"></div>
                </div>
            </div>
            <div>
                <div class="dashboard-section">
                    <h2>Recent Proposals</h2>
                    <div id="recentProposals"></div>
                </div>
                <div class="dashboard-section">
                    <h2>Completed Jobs</h2>
                    <div id="completedSection"></div>
                </div>
            </div>
        </div>

        <div style="margin-top:32px;display:flex;gap:12px;flex-wrap:wrap">
            <a href="/post-job.html" class="btn btn-primary">Post a Job</a>
            <a href="/jobs.html" class="btn btn-outline">Browse Jobs</a>
            <a href="/active-jobs.html" class="btn btn-outline">Active Jobs</a>
        </div>
    </div>

    <footer class="footer" id="footer"></footer>
    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
