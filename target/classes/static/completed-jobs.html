<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed Jobs - StudentGig</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-header">
        <div class="container">
            <h1>Completed Jobs</h1>
            <p>Your successfully completed projects</p>
        </div>
    </div>

    <div class="page-content">
        <div id="completedContainer"></div>
    </div>

    <div id="reviewModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
        <div class="form-card" style="margin:20px;max-width:500px;width:100%">
            <h2>Leave a Review</h2>
            <form id="reviewForm" onsubmit="submitReview(event)">
                <div class="form-group">
                    <label>Rating (1-5)</label>
                    <select id="rating" class="form-control" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Below Average</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comment</label>
                    <textarea id="comment" class="form-control" required></textarea>
                </div>
                <div style="display:flex;gap:12px">
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('reviewModal').style.display='none'">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer" id="footer"></footer>
    <script src="/js/app.js"></script>
    <script src="/js/jobs.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadCompletedJobs);</script>
</body>
</html>
